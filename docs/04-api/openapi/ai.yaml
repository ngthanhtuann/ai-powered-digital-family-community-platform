openapi: 3.1.0
info:
  title: FamilyConnect AI API
  version: 1.0.0
  description: >
    API cho tìm kiếm ngữ nghĩa, chatbot RAG, diễn giải quan hệ, tóm tắt và gợi ý.
    Tài khoản phải được xác minh. Tất cả truy xuất phải kiểm tra family_id và quyền xem.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: AI Search
  - name: AI Assistant
paths:
  /search:
    get:
      tags: [AI Search]
      summary: Tìm kiếm ngữ nghĩa
      operationId: semanticSearch
      x-roles: [MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 500 }
          example: "Ai là ông nội của Nguyễn Minh?"
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 10, default: 5 }
        - in: query
          name: familyId
          required: false
          description: >
            Phạm vi yêu cầu; server bắt buộc đối chiếu với security context.
            Không được dùng giá trị này để mở rộng quyền.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Kết quả tìm kiếm, có thể rỗng nếu không tìm thấy
          content:
            application/json:
              schema:
                type: object
                required: [query, results]
                properties:
                  query: { type: string }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/SearchResult" }
                  message:
                    type: string
                    example: "Không tìm thấy thông tin phù hợp."
              example:
                query: "Ai là ông nội của Nguyễn Minh?"
                results:
                  - sourceType: PERSON
                    sourceId: "4f9e3a8e-9e9a-4bb8-b2d1-1e2e2b7a0011"
                    content: "Nguyễn Văn An là ông nội của Nguyễn Minh."
                    score: 0.89
        "400": { $ref: "#/components/responses/AI002" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/AIUnavailable" }

  /ai/chat:
    post:
      tags: [AI Assistant]
      summary: Hỏi đáp gia phả bằng RAG
      operationId: chatWithFamilyAssistant
      x-roles: [MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      description: >
        Server truy xuất top-k sau khi lọc family_id và quyền xem; nếu context
        không đủ thì trả "Không tìm thấy thông tin." và không gọi LLM.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 4000 }
                sessionId: { type: string, format: uuid, nullable: true }
                familyId:
                  type: string
                  format: uuid
                  description: Phải đối chiếu với quyền trong security context.
            example:
              question: "Ai là ông nội của Nguyễn Minh?"
              sessionId: null
      responses:
        "200":
          description: Câu trả lời từ context hoặc thông báo không tìm thấy
          content:
            application/json:
              schema:
                type: object
                required: [answer, sources]
                properties:
                  sessionId: { type: string, format: uuid, nullable: true }
                  messageId: { type: string, format: uuid }
                  answer: { type: string }
                  sources:
                    type: array
                    items: { $ref: "#/components/schemas/SourceReference" }
                  latencyMs: { type: integer, minimum: 0 }
              example:
                sessionId: "b5a8c70a-9fd1-4d3e-87a2-4eab65ab0010"
                messageId: "f2d0c2d7-1c0e-42d5-b49d-9b42edaa0012"
                answer: "Nguyễn Văn An là ông nội của Nguyễn Minh."
                sources:
                  - sourceType: PERSON
                    sourceId: "4f9e3a8e-9e9a-4bb8-b2d1-1e2e2b7a0011"
                latencyMs: 8500
        "400": { $ref: "#/components/responses/AI002" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/AIUnavailable" }

  /ai/relationship-explanations:
    post:
      tags: [AI Assistant]
      summary: Giải thích quan hệ giữa hai thành viên
      operationId: explainRelationship
      x-roles: [MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      description: >
        Kết quả quan hệ phải do thuật toán của module genealogy cung cấp.
        LLM chỉ diễn đạt lại, không tự suy luận quan hệ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personAId, personBId]
              properties:
                personAId: { type: string, format: uuid }
                personBId: { type: string, format: uuid }
            example:
              personAId: "4f9e3a8e-9e9a-4bb8-b2d1-1e2e2b7a0011"
              personBId: "7b1f1d2c-31d8-4b7d-8b61-3c4a2a9e0013"
      responses:
        "200":
          description: Kết quả thuật toán được diễn đạt lại
          content:
            application/json:
              schema:
                type: object
                required: [explanation, found]
                properties:
                  found: { type: boolean }
                  explanation: { type: string }
                  path:
                    type: array
                    items: { type: object, additionalProperties: true }
              example:
                found: true
                explanation: "Theo dữ liệu gia phả, A là cháu của B qua đường quan hệ đã xác định."
                path: []
        "400": { $ref: "#/components/responses/AI002" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/AIUnavailable" }

  /ai/summaries:
    post:
      tags: [AI Assistant]
      summary: Tóm tắt bài đăng, câu chuyện hoặc tài liệu
      operationId: summarizeSource
      x-roles: [MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceType, sourceId]
              properties:
                sourceType:
                  type: string
                  enum: [POST, STORY, DOCUMENT]
                sourceId: { type: string, format: uuid }
                maxLength: { type: integer, minimum: 50, maximum: 2000, default: 500 }
            example:
              sourceType: STORY
              sourceId: "e7c6f7b1-87e8-4db2-9d9a-6acbb3c00014"
              maxLength: 500
      responses:
        "200":
          description: Tóm tắt nguồn mà người dùng được phép xem
          content:
            application/json:
              schema:
                type: object
                required: [summary, sourceType, sourceId, cached]
                properties:
                  summary: { type: string }
                  sourceType: { type: string }
                  sourceId: { type: string, format: uuid }
                  cached: { type: boolean }
              example:
                summary: "Câu chuyện kể lại lịch sử của gia đình qua ba thế hệ."
                sourceType: STORY
                sourceId: "e7c6f7b1-87e8-4db2-9d9a-6acbb3c00014"
                cached: false
        "400": { $ref: "#/components/responses/AI002" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/AIUnavailable" }

  /ai/recommendations:
    get:
      tags: [AI Assistant]
      summary: Gợi ý thành viên hoặc tài nguyên liên quan
      operationId: getRecommendations
      x-roles: [MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      parameters:
        - in: query
          name: contextType
          required: false
          schema: { type: string, enum: [PERSON, POST, STORY, DOCUMENT] }
        - in: query
          name: contextId
          required: false
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 10, default: 5 }
      responses:
        "200":
          description: Danh sách gợi ý trong phạm vi quyền xem
          content:
            application/json:
              schema:
                type: object
                required: [recommendations]
                properties:
                  recommendations:
                    type: array
                    items:
                      type: object
                      required: [sourceType, sourceId]
                      properties:
                        sourceType: { type: string }
                        sourceId: { type: string, format: uuid }
                        title: { type: string }
                        reason: { type: string }
              example:
                recommendations:
                  - sourceType: PERSON
                    sourceId: "4f9e3a8e-9e9a-4bb8-b2d1-1e2e2b7a0011"
                    title: "Nguyễn Văn An"
                    reason: "Có liên quan đến hồ sơ gia phả đang xem."
        "400": { $ref: "#/components/responses/AI002" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Unverified" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/AIUnavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SourceReference:
      type: object
      required: [sourceType, sourceId]
      properties:
        sourceType:
          type: string
          enum: [PERSON, POST, STORY, DOCUMENT]
        sourceId: { type: string, format: uuid }
    SearchResult:
      type: object
      required: [sourceType, sourceId, content, score]
      properties:
        sourceType:
          type: string
          enum: [PERSON, POST, STORY, DOCUMENT]
        sourceId: { type: string, format: uuid }
        content: { type: string }
        score: { type: number, minimum: 0, maximum: 1 }
    ErrorResponse:
      type: object
      required: [code, message, timestamp, path]
      properties:
        code: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }
        path: { type: string }
        details: { type: object, additionalProperties: true }
  responses:
    AI002:
      description: Request không hợp lệ
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            code: AI_002
            message: "Dữ liệu đầu vào không hợp lệ."
            timestamp: "2026-10-14T10:00:00Z"
            path: "/api/v1/ai/chat"
    Unauthorized:
      description: Thiếu hoặc token không hợp lệ
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            code: AUTH_001
            message: "Yêu cầu xác thực."
            timestamp: "2026-10-14T10:00:00Z"
            path: "/api/v1/search"
    Unverified:
      description: Tài khoản chưa xác minh hoặc không đủ quyền
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            code: PERM_002
            message: "Tài khoản chưa được xác minh để sử dụng AI."
            timestamp: "2026-10-14T10:00:00Z"
            path: "/api/v1/ai/chat"
    RateLimited:
      description: Vượt giới hạn số câu hỏi
      headers:
        Retry-After:
          schema: { type: integer }
          description: Số giây nên chờ trước khi thử lại
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            code: RATE_001
            message: "Bạn đã vượt giới hạn sử dụng AI. Vui lòng thử lại sau."
            timestamp: "2026-10-14T10:00:00Z"
            path: "/api/v1/ai/chat"
    AIUnavailable:
      description: LLM, embedding hoặc dịch vụ phụ thuộc không khả dụng/timeout
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            code: AI_001
            message: "Dịch vụ AI hiện không khả dụng. Vui lòng thử lại sau."
            timestamp: "2026-10-14T10:00:00Z"
            path: "/api/v1/ai/chat"