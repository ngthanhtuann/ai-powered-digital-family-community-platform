  responses:
    BadRequestError:
      description: Dữ liệu không hợp lệ (VALID_001)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            success: false
            error:
              code: VALID_001
              message: Dữ liệu yêu cầu không hợp lệ
              details:
              - {field: email, message: Email không đúng định dạng}
    UnauthorizedError:
      description: Thiếu, sai hoặc hết hạn token (AUTH_002)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            success: false
            error:
              code: AUTH_002
              message: Token không hợp lệ hoặc đã hết hạn
              details: []
    AccountLockedError:
      description: Tài khoản bị khóa (AUTH_003)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            success: false
            error:
              code: AUTH_003
              message: Tài khoản đã bị khóa
              details: []
    ForbiddenError:
      description: Không đủ quyền hoặc sai phạm vi (PERM_001), hoặc chưa được duyệt vào gia đình (PERM_002). Thứ tự kiểm tra ở auth.md mục 4.3.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          examples:
            permRole:
              summary: Không đủ quyền hoặc sai phạm vi (PERM_001)
              value:
                success: false
                error:
                  code: PERM_001
                  message: Không đủ quyền truy cập tính năng này
                  details: []
            permFamily:
              summary: Chưa được duyệt vào gia đình (PERM_002)
              value:
                success: false
                error:
                  code: PERM_002
                  message: Chưa được duyệt vào gia đình
                  details: []
    NotFoundError:
      description: Không tìm thấy dữ liệu (NOT_FOUND_001)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            success: false
            error:
              code: NOT_FOUND_001
              message: Tài nguyên không tồn tại
              details: []
    TooManyRequestsError:
      description: Vượt giới hạn request (RATE_001). Có header `Retry-After` (giây).
      headers:
        Retry-After:
          description: Số giây phải chờ trước khi thử lại.
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            success: false
            error:
              code: RATE_001
              message: Bạn thao tác quá nhanh, vui lòng thử lại sau
              details: []
    InternalServerError:
      description: Lỗi hệ thống (SERVER_001)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            success: false
            error:
              code: SERVER_001
              message: Lỗi hệ thống, vui lòng thử lại sau
              details: []
