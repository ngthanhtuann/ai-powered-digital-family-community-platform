  /admin/backups:
    post:
      tags: [Backup]
      summary: Tạo bản sao lưu (UC-AUTH-11)
      description: 'Vai trò: SYSTEM_ADMIN. Chạy script sao lưu: `pg_dump` cơ sở dữ liệu (gồm bảng vector) và nén thư mục tệp tải lên, lưu một tệp đặt tên theo ngày giờ vào thư mục `backups/` (SCRUM-86). Dữ liệu đồ án nhỏ nên chạy đồng bộ và trả về thông tin tệp. Mỗi lúc chỉ một việc sao lưu hoặc khôi phục (`409 ADM_003`). Ghi nhật ký `BACKUP_CREATED`.'
      operationId: adminCreateBackup
      x-roles: [SYSTEM_ADMIN]
      responses:
        '201':
          description: Đã tạo bản sao lưu
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupFileResponse'}
              example:
                success: true
                data: {id: familyconnect-20261012-020000, fileName: familyconnect-20261012-020000.tar.gz, fileSizeBytes: 15728640, createdAt: '2026-10-12T09:30:00+07:00'}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '409':
          description: 'ADM_003: Đang có tác vụ sao lưu hoặc khôi phục khác'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                success: false
                error:
                  code: ADM_003
                  message: Đang có tác vụ sao lưu hoặc khôi phục khác
                  details: []
        '500': {$ref: '#/components/responses/InternalServerError'}
    get:
      tags: [Backup]
      summary: Danh sách bản sao lưu (UC-AUTH-11)
      description: 'Vai trò: SYSTEM_ADMIN. Liệt kê các tệp trong thư mục `backups/`, mới nhất trước.'
      operationId: adminListBackups
      x-roles: [SYSTEM_ADMIN]
      parameters:
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Danh sách
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupFileListResponse'}
              example:
                success: true
                data:
                - {id: familyconnect-20261012-020000, fileName: familyconnect-20261012-020000.tar.gz, fileSizeBytes: 15728640, createdAt: '2026-10-12T09:30:00+07:00'}
                meta: {page: 0, size: 20, total: 1}
        '400': {$ref: '#/components/responses/BadRequestError'}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/restores:
    post:
      tags: [Backup]
      summary: Khôi phục từ bản sao lưu (UC-AUTH-11)
      description: 'Vai trò: SYSTEM_ADMIN. **Ghi đè dữ liệu hiện tại** bằng bản sao lưu nên bắt buộc `confirmText = "RESTORE"`. Chạy script khôi phục (`pg_restore` và giải nén tệp), trả `200` khi xong (không tạo tài nguyên mới nên không dùng 201). Bản sao lưu không tồn tại trả `404 NOT_FOUND_001`; đang có tác vụ khác trả `409 ADM_003`. Ghi nhật ký `RESTORE_COMPLETED`.'
      operationId: adminCreateRestore
      x-roles: [SYSTEM_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RestoreCreateRequest'}
            example: {backupId: familyconnect-20261012-020000, confirmText: RESTORE}
      responses:
        '200':
          description: Đã khôi phục
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RestoreResultResponse'}
              example:
                success: true
                data: {backupId: familyconnect-20261012-020000, restoredAt: '2026-10-12T09:45:00+07:00'}
        '400': {$ref: '#/components/responses/BadRequestError'}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '404': {$ref: '#/components/responses/NotFoundError'}
        '409':
          description: 'ADM_003: Đang có tác vụ sao lưu hoặc khôi phục khác'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                success: false
                error:
                  code: ADM_003
                  message: Đang có tác vụ sao lưu hoặc khôi phục khác
                  details: []
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/configs:
    get:
      tags: [Config]
      summary: Danh sách cấu hình hệ thống (UC-AUTH-12)
      description: 'Vai trò: SYSTEM_ADMIN. Trả toàn bộ khóa cấu hình (số lượng nhỏ nên không phân trang, `meta.total` bằng số phần tử), kèm nhóm và giá trị mặc định để giao diện nhóm theo mục. Khóa bí mật (JWT secret, khóa LLM, mật khẩu cơ sở dữ liệu) **không nằm** ở đây mà ở biến môi trường.'
      operationId: adminListConfigs
      x-roles: [SYSTEM_ADMIN]
      responses:
        '200':
          description: Danh sách
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemConfigListResponse'}
              example:
                success: true
                data:
                - {key: ai.chat.limit_per_hour, value: '20', valueType: INTEGER, group: AI, defaultValue: '20', description: Số câu hỏi trợ lý AI tối đa mỗi người mỗi giờ., updatedBy: 9b1c2d3e-4f50-4a61-8b72-0c1d2e3f4a5b, updatedAt: '2026-10-12T09:30:00+07:00'}
                meta: {page: 0, size: 100, total: 1}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /admin/configs/{key}:
    put:
      tags: [Config]
      summary: Đổi giá trị cấu hình (UC-AUTH-12)
      description: 'Vai trò: SYSTEM_ADMIN. Ghi đè giá trị của khóa đã có (không tạo khóa mới qua API). Giá trị phải đúng kiểu và khoảng cho phép (auth.md mục 5.3), sai trả `400 VALID_001`; khóa không tồn tại trả `404`. Nút "khôi phục mặc định" gửi lại `defaultValue`. Ghi nhật ký `CONFIG_CHANGED` kèm giá trị cũ và mới. Module khác đọc cấu hình qua bộ nhớ đệm tối đa 60 giây nên thay đổi có hiệu lực trong vòng 1 phút, không cần khởi động lại.'
      operationId: adminUpdateConfig
      x-roles: [SYSTEM_ADMIN]
      parameters:
      - {$ref: '#/components/parameters/ConfigKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfigUpdateRequest'}
            example: {value: '30'}
      responses:
        '200':
          description: Sau khi cập nhật
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemConfigResponse'}
              example:
                success: true
                data: {key: ai.chat.limit_per_hour, value: '30', valueType: INTEGER, group: AI, defaultValue: '20', description: Số câu hỏi trợ lý AI tối đa mỗi người mỗi giờ., updatedBy: 9b1c2d3e-4f50-4a61-8b72-0c1d2e3f4a5b, updatedAt: '2026-10-12T09:30:00+07:00'}
        '400': {$ref: '#/components/responses/BadRequestError'}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '404': {$ref: '#/components/responses/NotFoundError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Page:
      name: page
      in: query
      description: Số trang, bắt đầu từ 0.
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      description: Số phần tử mỗi trang (tối đa 100, vượt thì 400 VALID_001).
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    SortCreated:
      name: sort
      in: query
      schema:
        type: string
        default: createdAt,desc
        enum: ['createdAt,desc', 'createdAt,asc']
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ConfigKey:
      name: key
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z0-9_.]{3,100}$'}
      description: Khóa cấu hình, ví dụ `ai.chat.limit_per_hour`.
  schemas:
    PaginationMeta:
      type: object
      required: [page, size, total]
      properties:
        page: {type: integer, example: 0}
        size: {type: integer, example: 20}
        total: {type: integer, example: 1}
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field: {type: string}
        message: {type: string}
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: {type: boolean, example: false}
        error:
          type: object
          required: [code, message, details]
          properties:
            code: {type: string}
            message: {type: string}
            details:
              type: array
              description: Lỗi chi tiết từng trường; không có thì để mảng rỗng.
              items: {$ref: '#/components/schemas/ErrorDetail'}
    EmptyResponse:
      type: object
      description: Thao tác thành công không trả dữ liệu (`data` là null), dùng cho API xóa theo conventions.md mục 1.3.
      required: [success, data]
      properties:
        success: {type: boolean, example: true}
        data: {type: object, nullable: true, example: null}
    GlobalRole:
      type: string
      enum: [MEMBER, SYSTEM_ADMIN]
      description: Vai trò toàn hệ thống (bảng `user_role`), đặt trong access token. `BRANCH_ADMIN` không nằm ở đây vì gắn với gia đình và chi (xem `Membership`).
    MemberRole:
      type: string
      enum: [MEMBER, BRANCH_ADMIN]
      description: Vai trò trong gia đình (bảng `member_verification`).
    UserStatus:
      type: string
      enum: [ACTIVE, LOCKED]
    MembershipStatus:
      type: string
      enum: [NONE, PENDING, APPROVED, REJECTED, REMOVED]
      description: '`NONE`: chưa có yêu cầu. `PENDING`: chờ duyệt (chưa xác minh). `APPROVED`: đã xác minh. `REJECTED`: bị từ chối. `REMOVED`: đã chuyển sang gia đình khác do quản trị.'
    JoinRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED, REMOVED]
    ContentType:
      type: string
      enum: [POST, COMMENT, EVENT, ANNOUNCEMENT]
      description: Loại nội dung của module community có thể bị báo cáo.
    ReportStatus:
      type: string
      enum: [PENDING, HIDDEN, DISMISSED]
    ConfigValueType:
      type: string
      enum: [INTEGER, BOOLEAN, STRING]
    User:
      type: object
      required: [id, email, fullName, phone, dateOfBirth, roles, status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        fullName: {type: string}
        phone: {type: string, nullable: true}
        dateOfBirth: {type: string, format: date}
        roles:
          type: array
          items: {$ref: '#/components/schemas/GlobalRole'}
        status: {$ref: '#/components/schemas/UserStatus'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Membership:
      type: object
      description: 'Trạng thái tham gia gia đình của người đang đăng nhập. Frontend dùng để chọn màn hình: NONE → nhập mã gia đình hoặc tạo gia đình; PENDING → màn chờ duyệt; APPROVED → vào ứng dụng.'
      required: [status, role, familyId, familyName, branchId, branchName, joinRequestId, rejectReason, canCreateFamily]
      properties:
        status: {$ref: '#/components/schemas/MembershipStatus'}
        role:
          type: string
          nullable: true
          allOf:
          - {$ref: '#/components/schemas/MemberRole'}
        familyId: {type: string, format: uuid, nullable: true}
        familyName: {type: string, nullable: true}
        branchId: {type: string, format: uuid, description: 'Với `BRANCH_ADMIN`: chi quản lý (null là quản lý cả gia đình). Với `MEMBER`: chi người xin chọn, chỉ để thông tin.', nullable: true}
        branchName: {type: string, nullable: true}
        joinRequestId: {type: string, format: uuid, description: 'Có khi `status = PENDING`, để người dùng hủy yêu cầu.', nullable: true}
        rejectReason: {type: string, nullable: true}
        canCreateFamily: {type: boolean, description: True khi chưa là thành viên đã xác minh của gia đình nào (BR-GEN-15); `SYSTEM_ADMIN` luôn true.}
    TokenData:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: {type: string, description: 'JWT, hết hạn sau `expiresIn` giây (mặc định 900 = 15 phút, đọc từ `auth.access_token_minutes`).'}
        refreshToken: {type: string, description: 'Chuỗi ngẫu nhiên không phải JWT, hết hạn sau 7 ngày (mặc định, `auth.refresh_token_days`), dùng một lần (xoay vòng mỗi lần refresh).'}
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn: {type: integer, description: Giây.}
    LoginData:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, user, membership]
      properties:
        accessToken: {type: string}
        refreshToken: {type: string}
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn: {type: integer}
        user: {$ref: '#/components/schemas/User'}
        membership: {$ref: '#/components/schemas/Membership'}
    JoinRequest:
      type: object
      required: [id, userId, applicantName, applicantEmail, message, familyId, branchId, status, rejectReason, reviewedBy, reviewedAt, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        applicantName: {type: string}
        applicantEmail: {type: string, format: email}
        message: {type: string, nullable: true}
        familyId: {type: string, format: uuid}
        branchId: {type: string, format: uuid, description: Chi người xin chọn; null là xin vào cả gia đình., nullable: true}
        status: {$ref: '#/components/schemas/JoinRequestStatus'}
        rejectReason: {type: string, nullable: true}
        reviewedBy: {type: string, format: uuid, nullable: true}
        reviewedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ContentReport:
      type: object
      description: Báo cáo do module community lưu; admin đọc qua interface Java `ContentModerationPort`, không đọc trực tiếp bảng.
      required: [id, targetType, targetId, familyId, reporterId, reason, contentSnippet, status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        targetType: {$ref: '#/components/schemas/ContentType'}
        targetId: {type: string, format: uuid}
        familyId: {type: string, format: uuid}
        reporterId: {type: string, format: uuid}
        reason: {type: string, description: Lý do do người báo cáo nhập (dữ liệu của module community).}
        contentSnippet: {type: string, description: Trích tối đa 200 ký tự nội dung bị báo cáo.}
        status: {$ref: '#/components/schemas/ReportStatus'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AdminUser:
      type: object
      required: [id, email, fullName, phone, dateOfBirth, roles, status, lockReason, lastLoginAt, membership, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        fullName: {type: string}
        phone: {type: string, nullable: true}
        dateOfBirth: {type: string, format: date}
        roles:
          type: array
          items: {$ref: '#/components/schemas/GlobalRole'}
        status: {$ref: '#/components/schemas/UserStatus'}
        lockReason: {type: string, nullable: true}
        lastLoginAt: {type: string, format: date-time, nullable: true}
        membership: {$ref: '#/components/schemas/Membership'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AuditLog:
      type: object
      description: Bản ghi nhật ký chỉ thêm, không sửa nên không có `updatedAt` (ngoại lệ của conventions.md mục 5.1).
      required: [id, actorUserId, actorRole, action, targetType, targetId, familyId, ipAddress, detail, createdAt]
      properties:
        id: {type: string, format: uuid}
        actorUserId: {type: string, format: uuid, description: Null khi chưa xác định người thực hiện (ví dụ đăng nhập sai email)., nullable: true}
        actorRole:
          type: string
          enum: [MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
          nullable: true
        action: {type: string, description: 'Mã hành động, ví dụ LOGIN_FAILED, USER_LOCKED (danh mục ở auth.md mục 6.4).'}
        targetType: {type: string, nullable: true}
        targetId: {type: string, format: uuid, nullable: true}
        familyId: {type: string, format: uuid, nullable: true}
        ipAddress: {type: string, nullable: true}
        detail: {type: object, additionalProperties: true, description: 'Thông tin bổ sung không nhạy cảm. Không chứa mật khẩu, token, nội dung câu hỏi AI.', nullable: true}
        createdAt: {type: string, format: date-time}
    BackupFile:
      type: object
      description: Một bản sao lưu là một tệp trong thư mục `backups/` (SCRUM-86), không có bảng riêng.
      required: [id, fileName, fileSizeBytes, createdAt]
      properties:
        id: {type: string, description: Tên tệp bỏ phần đuôi; dùng làm `backupId` khi khôi phục.}
        fileName: {type: string}
        fileSizeBytes: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
    RestoreResult:
      type: object
      required: [backupId, restoredAt]
      properties:
        backupId: {type: string}
        restoredAt: {type: string, format: date-time}
    SystemConfig:
      type: object
      required: [key, value, valueType, group, defaultValue, description, updatedBy, updatedAt]
      properties:
        key: {type: string, example: ai.chat.limit_per_hour}
        value: {type: string, description: Giá trị dạng chuỗi; `INTEGER` và `BOOLEAN` được kiểm tra theo `valueType`.}
        valueType: {$ref: '#/components/schemas/ConfigValueType'}
        group: {type: string, description: Nhóm hiển thị trên trang cấu hình.}
        defaultValue: {type: string, description: 'Giá trị mặc định, dùng cho nút "khôi phục mặc định".'}
        description: {type: string}
        updatedBy: {type: string, format: uuid, nullable: true}
        updatedAt: {type: string, format: date-time}
    RegisterRequest:
      type: object
      required: [email, password, fullName, dateOfBirth]
      properties:
        email: {type: string, format: email, maxLength: 255}
        password: {type: string, minLength: 8, maxLength: 72, description: Từ 8 đến 72 ký tự (BR-AUTH-02).}
        fullName: {type: string, minLength: 1, maxLength: 150}
        phone: {type: string, pattern: '^(\+84|0)[0-9]{9,10}$', nullable: true}
        dateOfBirth: {type: string, format: date, description: Phải từ đủ 16 tuổi (BR-AUTH-03).}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: {type: string}
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string}
        newPassword: {type: string, minLength: 8, maxLength: 72}
    UpdateProfileRequest:
      type: object
      minProperties: 1
      description: Gửi các trường cần đổi (ít nhất một). Không đổi được email ở API này.
      properties:
        fullName: {type: string, minLength: 1, maxLength: 150}
        phone: {type: string, pattern: '^(\+84|0)[0-9]{9,10}$', nullable: true}
        dateOfBirth: {type: string, format: date}
    JoinRequestCreateRequest:
      type: object
      required: [familyId]
      properties:
        familyId: {type: string, format: uuid, description: 'Mã gia đình muốn tham gia. Trưởng chi cung cấp cho người thân (xem auth.md mục 8, câu 2).'}
        branchId: {type: string, format: uuid, description: Chi muốn tham gia; bỏ trống nếu không biết., nullable: true}
        message: {type: string, maxLength: 255, description: Lời nhắn giới thiệu bản thân cho trưởng chi., nullable: true}
    JoinRequestReviewRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [APPROVED, REJECTED]
        rejectReason: {type: string, maxLength: 255, description: Chỉ dùng khi `REJECTED`., nullable: true}
        personId: {type: string, format: uuid, description: 'Chỉ dùng khi `APPROVED`: gắn tài khoản với hồ sơ thành viên (`person`) có sẵn của gia đình.', nullable: true}
    ContentReportReviewRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [HIDE_CONTENT, DISMISS]
          description: '`HIDE_CONTENT`: ẩn nội dung bị báo cáo (đặt cột `hidden_at`, không xóa cứng). `DISMISS`: bỏ qua báo cáo.'
    AdminUserStatusRequest:
      type: object
      required: [status]
      properties:
        status: {$ref: '#/components/schemas/UserStatus'}
        lockReason: {type: string, maxLength: 255, description: Bắt buộc khi `status = LOCKED`., nullable: true}
    AdminUserRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/GlobalRole'}
          uniqueItems: true
          description: Danh sách đầy đủ vai trò toàn hệ thống (ghi đè). Luôn phải có `MEMBER`.
    AdminMembershipRequest:
      type: object
      required: [familyId, role]
      properties:
        familyId: {type: string, format: uuid}
        branchId: {type: string, format: uuid, description: 'Với `BRANCH_ADMIN`: chi quản lý, null là quản lý cả gia đình.', nullable: true}
        role: {$ref: '#/components/schemas/MemberRole'}
    RestoreCreateRequest:
      type: object
      required: [backupId, confirmText]
      properties:
        backupId: {type: string}
        confirmText:
          type: string
          enum: [RESTORE]
          description: Phải gửi đúng chữ `RESTORE` để xác nhận thao tác ghi đè dữ liệu.
    ConfigUpdateRequest:
      type: object
      required: [value]
      properties:
        value: {type: string, maxLength: 500}
    UserResponse:
