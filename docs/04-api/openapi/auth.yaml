# Người viết: TV1 (Tuấn Nguyễn Thanh). Reviewer: TV4 (Huy Quốc). Task Jira: SCRUM-26. Theo quy ước ở ../conventions.md
openapi: 3.0.3
info:
  title: FamilyConnect - Auth, RBAC, Profile, Admin
  version: 1.0.0
  description: |-
    Đặc tả API cho module Auth, RBAC, Profile, Admin (SCRUM-26). Tài liệu use case: `docs/01-srs/use-cases/auth.md`.

    **Quy ước chung** (theo conventions.md)
    - JSON và tên query dùng camelCase; id dùng UUID; thời gian theo ISO 8601 kèm múi giờ; enum `UPPER_SNAKE_CASE`.
    - Response thành công `{success, data, meta?}`; lỗi `{success:false, error:{code, message, details[]}}`. API xóa trả `200` với `data: null`.
    - Danh sách có `page` (từ 0), `size` (mặc định 20, tối đa 100, vượt thì `400 VALID_001`), `sort`.

    **Xác thực và phân quyền**
    - Access token JWT gửi qua `Authorization: Bearer <token>` (mặc định 15 phút); refresh token mặc định 7 ngày, dùng một lần (xoay vòng). Chi tiết luồng ở auth.md mục 4.2.
    - `x-roles` ở từng endpoint liệt kê vai trò được gọi, dùng 4 vai trò của srs.md Phụ lục A: `GUEST` (chưa đăng nhập), `MEMBER`, `BRANCH_ADMIN`, `SYSTEM_ADMIN`. "Thành viên chưa xác minh" là trạng thái của `MEMBER` (có `x-roles: MEMBER` nhưng bị chặn bởi `PERM_002` ở các API dữ liệu gia đình).
    - Thứ tự kiểm tra mọi request: token (`AUTH_002`) → tài khoản bị khóa (`AUTH_003`) → đã xác minh với API dữ liệu gia đình (`PERM_002`) → đủ vai trò (`PERM_001`) → đúng phạm vi gia đình, chi (`PERM_001`). Chi tiết ở auth.md mục 4.3.
    - `BRANCH_ADMIN` và việc "đã xác minh" không nằm trong token mà được tra từ bảng `member_verification` ở mỗi request, nên duyệt hoặc khóa có hiệu lực ngay.

    **Mã lỗi riêng**: `AUTH_004` đến `AUTH_006` và `ADM_001` đến `ADM_003` (đều 409). Mã dùng chung `AUTH_001` đến `AUTH_003`, `PERM_001`, `PERM_002`, `VALID_001`, `NOT_FOUND_001`, `RATE_001`, `SERVER_001`.

    **Ghi chú về URL**: động từ chỉ giữ `/auth/login`, `/auth/refresh` (conventions.md mục 1.1). Đăng ký là `POST /users`, đăng xuất là `DELETE /auth/sessions/current`, khôi phục là `POST /admin/restores`.
servers:
- {url: /api/v1}
security:
- bearerAuth: []
tags:
- {name: Auth, description: 'Đăng ký, đăng nhập, token, đổi mật khẩu (UC-AUTH-01 đến 04).'}
- {name: Profile, description: Hồ sơ cá nhân (UC-AUTH-05).}
- {name: Membership, description: 'Xin tham gia gia đình, duyệt thành viên (UC-AUTH-06, 07).'}
- {name: Admin, description: Quản lý người dùng (UC-AUTH-08).}
- {name: Moderation, description: Kiểm duyệt nội dung (UC-AUTH-09).}
- {name: Audit, description: Nhật ký kiểm toán (UC-AUTH-10).}
- {name: Backup, description: Sao lưu và khôi phục (UC-AUTH-11).}
- {name: Config, description: Cấu hình hệ thống (UC-AUTH-12).}
paths:
  /users:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản (UC-AUTH-01)
      description: 'Vai trò: công khai (`security: []`). Tạo tài khoản với vai trò toàn hệ thống `MEMBER`, trạng thái `ACTIVE`. Tài khoản **chưa xác minh** với gia đình nào: gọi API dữ liệu gia đình nhận `403 PERM_002` cho đến khi được duyệt (UC-AUTH-07). Không tự đăng nhập: client gọi tiếp `POST /auth/login`. Người dưới 16 tuổi không được tạo tài khoản (BR-AUTH-03).'
      operationId: registerUser
      x-roles: [GUEST, MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
            example: {email: an.nguyen@example.com, password: Matkhau123, fullName: Nguyễn Văn An, phone: '0901234567', dateOfBirth: '1990-05-12'}
      responses:
        '201':
          description: Đã tạo tài khoản
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
              example:
                success: true
                data:
                  id: 9b1c2d3e-4f50-4a61-8b72-0c1d2e3f4a5b
                  email: an.nguyen@example.com
                  fullName: Nguyễn Văn An
                  phone: '0901234567'
                  dateOfBirth: '1990-05-12'
                  roles: [MEMBER]
                  status: ACTIVE
                  createdAt: '2026-10-09T10:00:00+07:00'
                  updatedAt: '2026-10-09T10:00:00+07:00'
        '400': {$ref: '#/components/responses/BadRequestError'}
        '409':
          description: 'AUTH_004: Email đã được đăng ký'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                success: false
                error:
                  code: AUTH_004
                  message: Email đã được đăng ký
                  details: []
        '500': {$ref: '#/components/responses/InternalServerError'}
  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập (UC-AUTH-02)
      description: 'Vai trò: công khai (`security: []`). Trả access token (JWT) và refresh token kèm hồ sơ và trạng thái tham gia gia đình để frontend chọn màn hình. Sai email hoặc sai mật khẩu đều trả `401 AUTH_001` (không tiết lộ email có tồn tại hay không). Đúng mật khẩu nhưng tài khoản bị khóa trả `403 AUTH_003`. Giới hạn 5 lần mỗi phút theo IP và email (conventions.md mục 7.1), vượt thì `429 RATE_001`.'
      operationId: login
      x-roles: [GUEST, MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            example: {email: an.nguyen@example.com, password: Matkhau123}
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
              example:
                success: true
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI5YjFjMmQzZS00ZjUwLTRhNjEtOGI3Mi0wYzFkMmUzZjRhNWIifQ.c2lnbmF0dXJl
                  refreshToken: q3Xk9vT2mB7nLw1ZcR8dYe5HfJ0aPuGsNiOtKxVbMhA
                  tokenType: Bearer
                  expiresIn: 900
                  user:
                    id: 9b1c2d3e-4f50-4a61-8b72-0c1d2e3f4a5b
                    email: an.nguyen@example.com
                    fullName: Nguyễn Văn An
                    phone: '0901234567'
                    dateOfBirth: '1990-05-12'
                    roles: [MEMBER]
                    status: ACTIVE
                    createdAt: '2026-10-09T10:00:00+07:00'
                    updatedAt: '2026-10-09T10:00:00+07:00'
                  membership: {status: PENDING, role: MEMBER, familyId: 3f2a8c1e-0b7d-4e55-9a31-5d2c6b8e1a01, familyName: Dòng họ Nguyễn, branchId: 7a4d5c2e-1f08-4b93-a6d7-3e9f0c1b2a44, branchName: Chi trưởng, joinRequestId: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f, rejectReason: null, canCreateFamily: true}
        '400': {$ref: '#/components/responses/BadRequestError'}
        '401':
          description: Sai email hoặc mật khẩu (AUTH_001)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                success: false
                error:
                  code: AUTH_001
                  message: Sai email hoặc mật khẩu
                  details: []
        '403': {$ref: '#/components/responses/AccountLockedError'}
        '429': {$ref: '#/components/responses/TooManyRequestsError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Làm mới token (UC-AUTH-03)
      description: 'Vai trò: công khai (`security: []`), xác thực bằng refresh token trong body. Mỗi refresh token chỉ dùng **một lần**: thành công thì cấp cặp token mới và vô hiệu token cũ (xoay vòng). Token không tồn tại, hết hạn hoặc đã bị thu hồi trả `401 AUTH_002`. Tài khoản bị khóa trả `403 AUTH_003`.'
      operationId: refreshToken
      x-roles: [GUEST, MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
            example: {refreshToken: q3Xk9vT2mB7nLw1ZcR8dYe5HfJ0aPuGsNiOtKxVbMhA}
      responses:
        '200':
          description: Cặp token mới
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
              example:
                success: true
                data: {accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI5YjFjMmQzZS00ZjUwLTRhNjEtOGI3Mi0wYzFkMmUzZjRhNWIifQ.c2lnbmF0dXJl, refreshToken: q3Xk9vT2mB7nLw1ZcR8dYe5HfJ0aPuGsNiOtKxVbMhA, tokenType: Bearer, expiresIn: 900}
        '400': {$ref: '#/components/responses/BadRequestError'}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/AccountLockedError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /auth/sessions/current:
    delete:
      tags: [Auth]
      summary: Đăng xuất (UC-AUTH-03)
      description: 'Vai trò: mọi người đã đăng nhập. Thu hồi toàn bộ refresh token của người dùng; client xóa token đã lưu. Access token hiện tại vẫn hợp lệ đến khi hết hạn (mặc định tối đa 15 phút) vì server không lưu access token; riêng tài khoản bị khóa bị chặn ngay do trạng thái tài khoản được tra mỗi request (BR-AUTH-05). Dùng danh từ thay cho `POST /auth/logout` vì conventions.md mục 1.1 chỉ cho phép động từ ở `/auth/login`, `/auth/refresh`, `/ai/chat`.'
      operationId: logout
      x-roles: [MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      responses:
        '200':
          description: Đã đăng xuất
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmptyResponse'}
              example: {success: true, data: null}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/me/password:
    put:
      tags: [Auth]
      summary: Đổi mật khẩu (UC-AUTH-04)
      description: 'Vai trò: mọi người đã đăng nhập. Cần mật khẩu hiện tại. Thành công thì thu hồi mọi refresh token (phải đăng nhập lại ở thiết bị khác). Mật khẩu hiện tại sai trả `400 VALID_001` với `details[0].field = "currentPassword"` (không dùng `AUTH_001` để frontend không nhầm với đăng nhập sai).'
      operationId: changePassword
      x-roles: [MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
            example: {currentPassword: Matkhau123, newPassword: Matkhaumoi456}
      responses:
        '200':
          description: Đã đổi mật khẩu
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmptyResponse'}
              example: {success: true, data: null}
        '400': {$ref: '#/components/responses/BadRequestError'}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/AccountLockedError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/me:
    get:
      tags: [Profile]
      summary: Xem hồ sơ của tôi (UC-AUTH-05)
      description: 'Vai trò: mọi người đã đăng nhập (kể cả thành viên chưa xác minh). Chỉ trả hồ sơ của chính mình.'
      operationId: getMyProfile
      x-roles: [MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      responses:
        '200':
          description: Hồ sơ
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
              example:
                success: true
                data:
                  id: 9b1c2d3e-4f50-4a61-8b72-0c1d2e3f4a5b
                  email: an.nguyen@example.com
                  fullName: Nguyễn Văn An
                  phone: '0901234567'
                  dateOfBirth: '1990-05-12'
                  roles: [MEMBER]
                  status: ACTIVE
                  createdAt: '2026-10-09T10:00:00+07:00'
                  updatedAt: '2026-10-09T10:00:00+07:00'
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/AccountLockedError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    patch:
      tags: [Profile]
      summary: Cập nhật hồ sơ của tôi (UC-AUTH-05)
      description: 'Vai trò: mọi người đã đăng nhập. Đổi họ tên, số điện thoại, ngày sinh. Ngày sinh mới phải cho tuổi từ 16 trở lên. Email không đổi được.'
      operationId: updateMyProfile
      x-roles: [MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProfileRequest'}
            example: {fullName: Nguyễn Văn An B, phone: '0907654321'}
      responses:
        '200':
          description: Hồ sơ sau khi cập nhật
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
              example:
                success: true
                data:
                  id: 9b1c2d3e-4f50-4a61-8b72-0c1d2e3f4a5b
                  email: an.nguyen@example.com
                  fullName: Nguyễn Văn An B
                  phone: '0907654321'
                  dateOfBirth: '1990-05-12'
                  roles: [MEMBER]
                  status: ACTIVE
                  createdAt: '2026-10-09T10:00:00+07:00'
                  updatedAt: '2026-10-12T09:30:00+07:00'
        '400': {$ref: '#/components/responses/BadRequestError'}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/AccountLockedError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /users/me/membership:
    get:
      tags: [Membership]
      summary: Trạng thái tham gia gia đình của tôi (UC-AUTH-06)
      description: 'Vai trò: mọi người đã đăng nhập. Trả bản ghi đang hiệu lực (`PENDING`, `APPROVED`); nếu không có thì bản `REJECTED` gần nhất (để hiện lý do); nếu không có nữa thì `NONE`. Frontend gọi sau khi đăng nhập và định kỳ ở màn chờ duyệt. Tài khoản `SYSTEM_ADMIN` luôn trả `NONE` với `canCreateFamily = true`.'
      operationId: getMyMembership
      x-roles: [MEMBER, BRANCH_ADMIN, SYSTEM_ADMIN]
      responses:
        '200':
          description: Trạng thái
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MembershipResponse'}
              example:
                success: true
                data: {status: PENDING, role: MEMBER, familyId: 3f2a8c1e-0b7d-4e55-9a31-5d2c6b8e1a01, familyName: Dòng họ Nguyễn, branchId: 7a4d5c2e-1f08-4b93-a6d7-3e9f0c1b2a44, branchName: Chi trưởng, joinRequestId: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f, rejectReason: null, canCreateFamily: true}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/AccountLockedError'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /join-requests:
    post:
      tags: [Membership]
      summary: Gửi yêu cầu tham gia gia đình (UC-AUTH-06)
      description: 'Vai trò: thành viên **chưa xác minh** (`MEMBER` chưa thuộc gia đình nào). `SYSTEM_ADMIN` và người đã thuộc gia đình nhận `403 PERM_001`. Gia đình hoặc chi không tồn tại trả `404 NOT_FOUND_001`. Đã có yêu cầu chờ duyệt hoặc đã là thành viên trả `409 AUTH_005`. Khi cấu hình `membership.approval_mode = AUTO` yêu cầu được duyệt ngay (trả `status = APPROVED`).'
      operationId: createJoinRequest
      x-roles: [MEMBER]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JoinRequestCreateRequest'}
            example: {familyId: 3f2a8c1e-0b7d-4e55-9a31-5d2c6b8e1a01, branchId: 7a4d5c2e-1f08-4b93-a6d7-3e9f0c1b2a44, message: 'Con gái ông Nguyễn Văn Bình, chi trưởng.'}
      responses:
        '201':
          description: Đã gửi yêu cầu, chờ trưởng chi duyệt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JoinRequestResponse'}
              example:
                success: true
                data: {id: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f, userId: 2c7e9a10-5b3d-4f6a-8e21-7d9c0b1a2e33, applicantName: Nguyễn Thị Hoa, applicantEmail: hoa.nguyen@example.com, message: 'Con gái ông Nguyễn Văn Bình, chi trưởng.', familyId: 3f2a8c1e-0b7d-4e55-9a31-5d2c6b8e1a01, branchId: 7a4d5c2e-1f08-4b93-a6d7-3e9f0c1b2a44, status: PENDING, rejectReason: null, reviewedBy: null, reviewedAt: null, createdAt: '2026-10-12T09:30:00+07:00', updatedAt: '2026-10-12T09:30:00+07:00'}
        '400': {$ref: '#/components/responses/BadRequestError'}
        '401': {$ref: '#/components/responses/UnauthorizedError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '404': {$ref: '#/components/responses/NotFoundError'}
        '409':
          description: 'AUTH_005: Bạn đã thuộc một gia đình hoặc đang có yêu cầu chờ duyệt'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                success: false
                error:
                  code: AUTH_005
                  message: Bạn đã thuộc một gia đình hoặc đang có yêu cầu chờ duyệt
                  details: []
        '500': {$ref: '#/components/responses/InternalServerError'}
    get:
      tags: [Membership]
      summary: Danh sách yêu cầu tham gia cần duyệt (UC-AUTH-07)
      description: 'Vai trò: BRANCH_ADMIN, SYSTEM_ADMIN. `BRANCH_ADMIN` chỉ thấy yêu cầu thuộc gia đình của mình và trong chi mình quản lý kèm chi con (BR-AUTH-10); quản lý cả gia đình thì thấy mọi yêu cầu của gia đình. `SYSTEM_ADMIN` thấy tất cả, lọc thêm theo `familyId`. Mặc định `status = PENDING`. Có email và lời nhắn của người xin để trưởng chi đối chiếu.'
      operationId: listJoinRequests
      x-roles: [BRANCH_ADMIN, SYSTEM_ADMIN]
      parameters:
      - name: status
        in: query
        description: Lọc theo trạng thái; mặc định PENDING.
        schema: {$ref: '#/components/schemas/JoinRequestStatus'}
      - name: familyId
        in: query
        description: Chỉ dành cho SYSTEM_ADMIN; BRANCH_ADMIN bị bỏ qua.
        schema: {type: string, format: uuid}
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/Size'}
      - {$ref: '#/components/parameters/SortCreated'}
      responses:
        '200':
          description: Danh sách
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JoinRequestListResponse'}
              example:
                success: true
                data:
                - {id: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f, userId: 2c7e9a10-5b3d-4f6a-8e21-7d9c0b1a2e33, applicantName: Nguyễn Thị Hoa, applicantEmail: hoa.nguyen@example.com, message: 'Con gái ông Nguyễn Văn Bình, chi trưởng.', familyId: 3f2a8c1e-0b7d-4e55-9a31-5d2c6b8e1a01, branchId: 7a4d5c2e-1f08-4b93-a6d7-3e9f0c1b2a44, status: PENDING, rejectReason: null, reviewedBy: null, reviewedAt: null, createdAt: '2026-10-12T09:30:00+07:00', updatedAt: '2026-10-12T09:30:00+07:00'}
                meta: {page: 0, size: 20, total: 1}
