name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: familyconnect
          POSTGRES_USER: familyconnect
          POSTGRES_PASSWORD: familyconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U familyconnect -d familyconnect"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build và chạy test
        run: mvn -B verify
        working-directory: backend

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Kiểu sinh từ OpenAPI phải khớp bản đã commit
        run: |
          npm run gen:api
          git diff --exit-code -- src/services/generated
      - run: npm run lint
      - run: npm run build
