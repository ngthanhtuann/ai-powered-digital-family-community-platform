spring:
  application:
    name: familyconnect-backend

  servlet:
    multipart:
      # Bằng giới hạn PDF của Heritage (10 MB); giới hạn 5 MB của ảnh do MediaUploadService kiểm tra.
      max-file-size: 10MB
      max-request-size: 11MB

  datasource:
    # Giá trị mặc định dùng cho máy local (docker compose up -d db).
    # Khi chạy trong Docker, docker-compose.yml ghi đè bằng biến môi trường.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/familyconnect}
    username: ${SPRING_DATASOURCE_USERNAME:familyconnect}
    password: ${SPRING_DATASOURCE_PASSWORD:familyconnect}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html