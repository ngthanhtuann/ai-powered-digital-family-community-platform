spring:
  application:
    name: familyconnect-backend

  servlet:
    multipart:
      # Bằng giới hạn PDF của Heritage (10 MB); giới hạn 5 MB của ảnh do MediaUploadService kiểm tra.
      max-file-size: 10MB
      max-request-size: 11MB

  datasource:
    # Giá trị mặc định dùng cho máy local (docker compose up -d db).
    # Khi chạy trong Docker, docker-compose.yml ghi đè bằng biến môi trường.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/familyconnect}
    username: ${SPRING_DATASOURCE_USERNAME:familyconnect}
    # Không đặt mật khẩu mặc định trong mã nguồn; cấu hình khi chạy bằng IDE hoặc Docker.
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  jwt:
    # Bắt buộc đặt bằng biến môi trường, tối thiểu 32 ký tự (conventions.md mục 7.2). Không ghi giá trị vào Git.
    secret: ${JWT_SECRET:}
    # Thời hạn mặc định (auth.md mục 4.2). SCRUM-94 sẽ đọc từ system_config.
    access-token-minutes: 15
    refresh-token-days: 7
  auth:
    # Giới hạn đăng nhập theo IP và email (conventions.md mục 7.1).
    login-rate-limit-per-minute: 5
    # /auth/refresh không có email, giới hạn theo IP để chặn dò token.
    refresh-rate-limit-per-minute: ${AUTH_REFRESH_RATE_LIMIT_PER_MINUTE:20}
    # Tạo SYSTEM_ADMIN đầu tiên khi chưa có (BR-AUTH-20). Để trống thì bỏ qua.
    bootstrap-admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Hiện x-roles (vai trò được gọi) dưới từng endpoint, xem EndpointRoles (SCRUM-43).
    show-extensions: true

# Gemini Embedding cho chỉ mục AI (adr-ai-spike.md, ai-rag.md). Khóa đặt trong .env, không đưa vào Git;
# để trống thì backend vẫn chạy, chỉ bỏ qua bước lập chỉ mục.
gemini:
  api-key: ${GEMINI_API_KEY:}
  embedding-model: gemini-embedding-001
  chat-model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}

ai:
  chat:
    limit_per_hour: ${AI_CHAT_LIMIT_PER_HOUR:20}
    top_k: 5
    minimum_score: 0.55
    retention_days: 30
    timeout_ms: ${AI_CHAT_TIMEOUT_MS:30000}
    enabled: ${AI_CHAT_ENABLED:true}
