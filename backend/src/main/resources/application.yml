spring:
  application:
    name: familyconnect-backend

  servlet:
    multipart:
      # Bằng giới hạn PDF của Heritage (10 MB); giới hạn 5 MB của ảnh do MediaUploadService kiểm tra.
      max-file-size: 10MB
      max-request-size: 11MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/familyconnect_ai}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8081

app:
  heritage:
    genealogy:
      # Tạm đến SCRUM-37: personUUID=familyUUID;personUUID=familyUUID. Để trống thì không tra được người liên quan.
      people: ${HERITAGE_GENEALOGY_PEOPLE:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  jwt:
    # Bắt buộc đặt bằng biến môi trường, tối thiểu 32 ký tự (conventions.md mục 7.2). Không ghi giá trị vào Git.
    secret: ${JWT_SECRET:}
    # Thời hạn mặc định (auth.md mục 4.2). SCRUM-94 sẽ đọc từ system_config.
    access-token-minutes: 15
    refresh-token-days: 7
  auth:
    # Giới hạn đăng nhập theo IP và email (conventions.md mục 7.1).
    login-rate-limit-per-minute: 5
    # Tạo SYSTEM_ADMIN đầu tiên khi chưa có (BR-AUTH-20). Để trống thì bỏ qua.
    bootstrap-admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

gemini:
  
  embedding-model: gemini-embedding-001