spring:
  application:
    name: familyconnect-backend
  datasource:
    # Giá trị mặc định dùng cho máy local (docker compose up -d db).
    # Khi chạy trong Docker, docker-compose.yml ghi đè bằng biến môi trường.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/familyconnect}
    username: ${SPRING_DATASOURCE_USERNAME:familyconnect}
    password: ${SPRING_DATASOURCE_PASSWORD:familyconnect}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema chỉ thay đổi qua Flyway migration
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
