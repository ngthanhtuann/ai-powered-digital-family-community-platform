# SCRUM-96: HA stack riêng. Chạy: docker compose -f docker-compose.ha.yml up -d --build
# Không chạy đồng thời với docker-compose.yml thường vì dùng cùng cổng và volume.
x-backend-env: &backend-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-familyconnect}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-familyconnect}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  MEDIA_STORAGE_PATH: /var/lib/familyconnect/media
  BACKUP_STORAGE_PATH: /var/lib/familyconnect/backups
  PGHOST: db
  PGPORT: '5432'
  PGDATABASE: ${POSTGRES_DB:-familyconnect}
  PGUSER: ${POSTGRES_USER:-familyconnect}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  JWT_SECRET: ${JWT_SECRET:-}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  AUTH_REFRESH_RATE_LIMIT_PER_MINUTE: ${AUTH_REFRESH_RATE_LIMIT_PER_MINUTE:-20}
  HA_SHARED_RATE_LIMITS: 'true'
  HA_LOCAL_CACHE_ENABLED: 'false'
  SERVER_FORWARD_HEADERS_STRATEGY: framework
x-backend-service: &backend-service
  build: ./backend
  volumes:
    - uploads:/var/lib/familyconnect/media
    - backups:/var/lib/familyconnect/backups
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ['CMD', 'curl', '--fail', '--silent', '--output', '/dev/null', 'http://127.0.0.1:8080/actuator/health']
    interval: 10s
    timeout: 5s
    start_period: 90s
    retries: 5
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familyconnect}
      POSTGRES_USER: ${POSTGRES_USER:-familyconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-familyconnect} -d ${POSTGRES_DB:-familyconnect}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend-primary:
    <<: *backend-service
    environment:
      <<: *backend-env
      HA_REMINDERS_ENABLED: 'true'

  backend-secondary:
    <<: *backend-service
    environment:
      <<: *backend-env
      HA_REMINDERS_ENABLED: 'false'
    # Khởi động sau primary để bootstrap admin và Flyway không chạy tranh nhau.
    depends_on:
      db:
        condition: service_healthy
      backend-primary:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '8080:8080'
    volumes:
      - ./docker/nginx/ha.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-primary:
        condition: service_healthy
      backend-secondary:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - '3000:3000'
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  backups:
