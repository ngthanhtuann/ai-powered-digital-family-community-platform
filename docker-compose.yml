# Chạy toàn bộ khung hệ thống: docker compose up --build
# Chỉ chạy cơ sở dữ liệu (để chạy backend bằng IDE): docker compose up -d db
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: familyconnect-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familyconnect}
      POSTGRES_USER: ${POSTGRES_USER:-familyconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familyconnect}
    # Chỉ mở cho chính máy này để chạy backend bằng IDE (privacy.md mục 7); bản triển khai (SCRUM-68) bỏ cổng này.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familyconnect} -d ${POSTGRES_DB:-familyconnect}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: familyconnect-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-familyconnect}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-familyconnect}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-familyconnect}
      MEDIA_STORAGE_PATH: /var/lib/familyconnect/media
      # Bắt buộc (SCRUM-35): đặt trong .env; thiếu thì backend dừng ngay khi khởi động và báo lỗi.
      JWT_SECRET: ${JWT_SECRET:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/var/lib/familyconnect/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # frontend: sẽ thêm ở các task sau (Next.js, SCRUM-33)

volumes:
  pgdata:
  uploads: