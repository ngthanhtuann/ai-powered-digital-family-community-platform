# SCRUM-96: Nginx round-robin; chuyển qua upstream còn sống nếu một backend lỗi.
upstream familyconnect_backend {
    server backend-primary:8080 max_fails=1 fail_timeout=3s;
    server backend-secondary:8080 max_fails=1 fail_timeout=3s;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 11m;

    # Trả đúng envelope FILE_001 nếu Nginx chặn trước backend.
    error_page 413 = @upload_too_large;
    location @upload_too_large {
        default_type application/json;
        return 413 '{"success":false,"error":{"code":"FILE_001","message":"Tệp vượt kích thước cho phép","details":[]}}';
    }

    location / {
        proxy_pass http://familyconnect_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ghi đè header đến từ trình duyệt để tránh giả mạo IP khi rate-limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }
}
